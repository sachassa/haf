# Solution Design Policy — 기본 프로파일 (Policy as Data — planning/specs/04-solution-design.md §3.2)
# 정본 값 문면: planning/adapters/claude/solution-design-binding.md §7.2 (최소 실값 1세트)
#   (구 포인터 uahf/framework/adapters/claude/solution-design-binding.md 는 미실재 — 상류 바인딩 재배치 트랙 잔재·정정됨)
# 값 조정 = 데이터 정정 — 규약 절차·정본 계약 무변경 (04 §3.2)
policyId: default-policy

# (가) 성숙/스킵 판정 기준 (04 §3.2 — 산출은 이진 분기·판정 근거 기록)
maturationSignals:
  - "architectureDirection.open 비공집합 (미결 설계 결정 존재)"      # 03 §3.2-A 그룹 6
  - "readiness.openQuestions 비공집합 (미해결 질문 존재)"            # 03 §3.2-A 그룹 8
  - "assumptionLedger 비공집합 (미해결 가정 — ReadyWithAssumptions)" # 03 §3.2-A 그룹 7
  - "다관심사 지표 (설계 관심사 2개 이상 교차)"
skipRule: "위 신호 전부 부재 ∧ 단일 관심사 → 스킵 (T2 Assessing→Validating · T9 확인→Skipped · 경량 사용자 확인 D6)"

# (나) 역할 선택 규칙 (04 §3.3 — Capability 선언·개방 네임스페이스·최소 할당·전체 커버리지 바닥)
roleSelection:
  basis: "판정 근거가 식별한 설계 관심사에서 파생"
  perConcern: 1                 # 관심사당 최소 필요 역할만
  wholeScopeCoverage: required  # 04 §3.3 커버리지 바닥·SP-INV 9 — 선언 전체 범위 관장 역할은 필수 바닥(전문 역할 상한 불산입)
  maxSpecialistRoles: 5         # SP-INV 8 — 전문/관심사 역할만 상한(커버리지 바닥 불산입). 기본 2(baseSpecialists) + 조건부 3(conditionalSpecialists). §DC-6 configurable(초과 시 로더가 선언순 우선 cap 집행·excludedByCap 방출)
  fixedTeam: "금지"             # SP-INV 5 — 개방 네임스페이스·고정 역할 카탈로그 0. 아래 defaultComposition은 강제 고정팀이 아니라 "기본값(이탈 시 사유 기록)"이며 fixedTeam=금지와 무모순

  # 기본 역할 구성 (강제 기본값 — 책임 있는 자율: 루트 ARCHITECTURE.md §6 원칙 11 (a)(b))
  # 역할명은 개방 네임스페이스 예시이며 고정 강제 아님·configurable(§DC-6). 정본=이 정책, 예시 카탈로그=비정본 부록(planning/docs/appendix/expert-role-catalog.md §3.5).
  # defaultComposition은 "기본값(default)"이지 "강제 고정팀"이 아니다 — 이탈은 deviationRule로 사유 기록 + Validating 게이트 표면화(silentOmission 금지·SP-INV 8 최소할당 존치).
  defaultComposition:
    coverageFloor: PM                       # wholeScopeCoverage 바닥 실현 — 완결성 관장·횡단(전문 역할 상한 불산입)
    baseSpecialists: [기획, 아키텍처]        # 기본 전문역할(항상 파생 후보)
    conditionalSpecialists:
      # when = 사람용 산문(참고) · whenSignal = 기계 신호(form-B 로더가 대조 매칭 — 산문 파싱 안 함).
      - { role: 디자이너, when: "touchpoint(접점) 선언 시", whenSignal: touchpoint }   # 접점 선언 시 편입
      - { role: DBA,     when: "데이터 복잡 시",          whenSignal: dataComplex }   # 데이터 복잡 신호 시 편입
      - { role: 보안,     when: "규제·컴플라이언스 신호 시", whenSignal: regulated }    # 규제/컴플라이언스 신호 시 편입(심의 참여·산출물 미소유)

  # 이탈 규칙 (책임 있는 자율 (b)(c) — silentOmission 금지)
  deviationRule:
    trigger: "기본 구성(defaultComposition)에서 역할 추가/제거 시"
    record:  "사유 기록 — 성숙 run 기록(events/maturation-<run-id>/)에 남김"
    surface: "Validating 게이트에서 표면화·사용자 확인 (고임팩트 이탈은 즉시)"

# (다) Projection 선택 정책 (04 §3.5 — 동적 선택=기본값 opt-out·전 유형 강제 금지·SP-INV 9 기본 필수 세트)
projectionSelection:
  # 개방 레지스트리 전체 카탈로그는 비정본 부록(projection-catalog.md) 소관 — 아래 defaultRequiredSet은
  # 그 카탈로그 중 성숙 경로 default-required 부분집합(층위: 부록=전체 레지스트리, Policy=기본 필수 세트).
  typeCatalog: open-registry
  mode: "프로젝트 유형·복잡도에 따라 동적 선택"   # 04 §3.5 — 기본값으로부터 정당화된 이탈(opt-out), 기본값 opt-in 아님
  forceAllTypes: "금지"                          # 개방 레지스트리 전체 강제 금지 — defaultRequiredSet은 성숙 경로 default-required 부분집합(무모순)
  existingCanonical: "대상 워크스페이스에 해당 유형 정본 실재 시 신규 강제 0"

  # requirement 클래스 정의 (SP-INV 9 — 요건 클래스별 default-required 조건)
  requirementClasses:
    always:     "항상 default-required — 제외는 설계단계 명시 결정 + 사유 기록 + 사용자 확인만"
    touchpoint: "접점(웹·앱·포털) 선언 시 required — 미선언 시 클래스 제외: 표면화·확인 필요(classExclusions)"
    interface:  "외부 연계 선언 시 required — 미선언 시 클래스 제외: 표면화·확인 필요(classExclusions)"

  # 기본 필수 Projection 세트 (성숙 경로 default-required 부분집합 — 정본 값 문면: 바인딩 §7.2 (다))
  defaultRequiredSet:
    - { id: project-plan,     name: "프로젝트 계획서",     requirement: always }
    - { id: requirements-def, name: "요구사항 정의서",     requirement: always }
    - { id: business-process, name: "업무 프로세스",       requirement: always }
    - { id: functional-spec,  name: "기능 명세서",         requirement: always }
    - { id: table-def,        name: "테이블 정의서",       requirement: always }
    - { id: test-plan-cases,  name: "테스트 계획·케이스",   requirement: always }
    - { id: screen-list,      name: "화면 목록",           requirement: touchpoint }
    - { id: menu-structure,   name: "메뉴 구조도",         requirement: touchpoint }
    - { id: screen-design,    name: "화면 설계서",         requirement: touchpoint }
    - { id: interface-spec,   name: "인터페이스 명세서",   requirement: interface }
    # (신규·Visual Contract 트랙) 디자인 필수 산출물 3종 — 접점 선언 시 required(touchpoint 클래스).
    # 값 조정 = 데이터 정정(규약 무변경·Policy as Data). 위 10종 행·주석은 무수정(가법).
    # 정본 값 문면: 바인딩 §7.2 (다) · 요소별 작성 가이드(비강제): planning/docs/appendix/visual-contract-catalog.md.
    - { id: design-tokens,           name: "디자인 토큰·톤앤매너 확정 기록", requirement: touchpoint }
    - { id: screen-mock,             name: "화면 mock(HTML)",              requirement: touchpoint }
    - { id: mock-convergence-record, name: "mock 수렴 확정 기록",          requirement: touchpoint }

  # 제외 규칙 (SP-INV 9 — 침묵 누락 금지)
  exclusionRule:
    silentOmission: "금지"   # 산출도 제외 기록도 없이 구현 경계 넘기 금지 (04 SP-INV 9)
    # touchpoint/interface 클래스가 미선언으로 전체 제외될 때: 조용한 자동 N/A 폐기 —
    # 클래스 드롭을 사유+사용자 확인(classExclusions.<class>)으로 표면화(고임팩트 이탈·원칙 11 (c)).
    classExclusionOnNonDeclaration: "표면화 — declaredTouchpoints/declaredInterfaces 공집합으로 클래스가 제외되면 매니페스트 classExclusions.<class>{reason,confirmedBy} 필수. 조용한 자동 N/A 금지(silentOmission 금지 동형)."
    manualExclude:  "always 클래스 제외 시 사유 기록 + 사용자 확인 — 성숙 run 기록(events/maturation-<run-id>/)에 남김"

# (라) 역할→산출물 소유 맵 (04 §3.3 역할·§3.5 Projection 교차 — 책임 있는 자율: 강제 기본값·이탈 사유기록)
# 각 defaultRequiredSet id 의 소유 역할. 역할명은 roleSelection.defaultComposition 과 동일 개방 네임스페이스 예시(configurable·고정 강제 아님).
# 소유(owner) = 해당 산출물 작성 책임 역할 — 위임 서브에이전트가 자기 소유 산출물을 작성한다(생산 프로토콜 = 바인딩 §7A).
# 13 항목은 projectionSelection.defaultRequiredSet 13 id 와 1:1 대응(교차 정합 — Visual Contract 3종 가법 후).
# 소유 매핑 부재 = solution_design_resolve._compute_artifact_plan PolicyError(교차 정합 강제) — 신규 산출물도 owner 필수.
artifactOwnership:
  - { id: project-plan,     owner: PM,        note: "프로젝트 계획서 + 횡단 완결성 검증(전체 커버리지 관장)" }
  - { id: requirements-def, owner: 기획 }
  - { id: business-process, owner: 기획 }
  - { id: functional-spec,  owner: 기획 }
  - { id: test-plan-cases,  owner: 기획 }
  - { id: table-def,        owner: 아키텍처,  assist: DBA, note: "DBA는 데이터 복잡 시 table-def 정밀화 보조" }
  - { id: interface-spec,   owner: 아키텍처 }
  - { id: screen-list,      owner: 디자이너 }
  - { id: menu-structure,   owner: 디자이너 }
  - { id: screen-design,    owner: 디자이너 }
  # (신규·Visual Contract) 디자인 산출물 3종 소유 = 디자이너(접점 선언 시 활성·conditionalSpecialists).
  - { id: design-tokens,           owner: 디자이너, note: "디자인 토큰·톤앤매너(스케일 선택·레퍼런스 앵커·금지 목록) 확정 기록" }
  - { id: screen-mock,             owner: 디자이너, note: "확정 와이어프레임·토큰 소비 HTML mock(파생 뷰·정본은 설계 산출물+토큰)" }
  - { id: mock-convergence-record, owner: 디자이너, note: "사용자 mock 수렴 확정 기록 — 확인자·라운드 수·잔여 피드백 0" }

# (마) 다라운드 심의 정책 (04 §3.4-C 다라운드 심의 — 바인딩 §7B 규약 절차가 소비·§DC-5)
# 정본 값 문면: 바인딩 §7.2 (라). 소비 지점 표: 바인딩 §7B.4(실값 없음·포인터만). 여기가 실값 정본(정본 값 == policy 값).
deliberation:
  maxRounds: 3                          # §DC-5 T5 재제안 라운드 상한(라운드 1 + 재제안 최대 2)·configurable — 상한 도달 시 잔여 충돌 Validating 표면화(바인딩 §7B.5)
  convergence: unresolvedConflictsZero  # 수렴 기준(미해소 충돌 0) — 04 §3.4-B T4/T6 Guard의 policy 측 파라미터
  peerVisibility: conflictParties       # 라운드 2+ 동료 Proposal 동봉 범위 기본값(충돌 당사자만·경량). 허용값: conflictParties | allActive(전 활성 역할 동봉으로 상향 가능·configurable)

  # 이탈 규칙 (책임 있는 자율 (b)(c) — silentOmission 금지 · roleSelection.deviationRule 문면 동형)
  deviationRule:
    trigger: "심의 기본값(maxRounds·convergence·peerVisibility)에서 이탈 시"
    record:  "사유 기록 — 성숙 run 기록(events/maturation-<run-id>/)에 남김"
    surface: "Validating 게이트에서 표면화·사용자 확인 (고임팩트 이탈은 즉시)"

# (바) 디자인 필수 요소 정책 (Visual Contract 트랙 — projectionSelection 과 형제 레벨·Policy as Data)
# 디자인 필수 요소를 비정본 부록이 아니라 Policy 데이터 + 게이트로 강제한다(책임 있는 자율 (a)·§DC-1 동형).
# 값 조정 = 데이터 정정(규약 무변경). 정본 값 문면: 바인딩 §7.2 (바). 소비 체커: design_completeness.py.
# 요소별 작성 가이드(잘 만드는 법·예시)는 비정본 부록 planning/docs/appendix/visual-contract-catalog.md(강제 근거 아님·SP-INV 5).
designElements:
  appliesWhen: touchpoint   # 접점 선언 시에만 적용(미선언 시 이 섹션 전체 비적용 — classExclusions 경로가 커버)
  screenScope:              # 화면 단위 — 각 화면이 커버해야 하는 필수 요소
    - { id: layout-structure,  name: "레이아웃 구조(그리드·주요 영역 구획)" }
    - { id: navigation,        name: "네비게이션 위치·진입/이탈 경로" }
    - { id: component-states,  name: "컴포넌트 상태 5종(기본·로딩·빈·오류·비활성)" }
    - { id: data-rules,        name: "데이터 표시 규칙(정렬·페이징·포맷)" }
    - { id: responsive,        name: "반응형 기준(브레이크포인트 최소 1)" }
    # (신규·Wave 3 UX) 아래 2종은 UI 상태/레이아웃과 다른 축이다(중복 아님·경계):
    #   component-states = 상태 화면의 **존재** / feedback-rules = 알림·피드백 **방식** / error-recovery = 복구 **경로**.
    - { id: error-recovery,    name: "오류 복구 경로(실패 시 이동·되돌리기)" }
    - { id: feedback-rules,    name: "피드백 규칙(로딩·성공·실패 알림 방식)" }
  projectScope:             # 프로젝트 단위 — 1회
    - { id: design-tokens-values, name: "디자인 토큰 실값" }
    - { id: tone-and-manner,      name: "톤앤매너 확정(스케일 선택·레퍼런스 앵커·금지 목록)" }
    # (신규·Wave 3 UX) 프로젝트 단위 UX 필수 요소 — 결함-인접·보편 1종만(오버엔지니어링 방지·사용자 결정 2026-07-19).
    # 제품 의존 항목(onboarding-flow·user-types·ux-copy·다국어 등)은 기본 필수 세트에 넣지 않는다 — 형식적 제외 기록 양산 방지.
    # 인터뷰·설계에서 필요가 선언되면 해당 프로젝트의 policy 사본에 데이터로 추가(Policy as Data·프레임워크 무변경)하여 그 프로젝트에서만 required가 된다
    # (touchpoint/interface 선언-조건부 패턴과 동형). 편입 항목 목록·절차 = 비정본 부록 visual-contract-catalog.md.
    - { id: user-journey-map, name: "핵심 사용자 여정 맵(주요 태스크별 진입→완료 단계)" }
    # accessibility-floor 는 criteria(접근성 실값)를 병기한다. criteria = 정보성 — 검증 게이트(사람 판정)의
    # 기준 문면이며 design_completeness 체커는 판정하지 않는다(체커는 covered/정당화 excluded 선언 완전성만 봄).
    - id: accessibility-floor
      name: "접근성 최소선(명도 대비·포커스 표시·터치 타겟)"
      criteria:
        - "본문 명도 대비 ≥ 4.5:1 (WCAG AA)"
        - "대형 텍스트(18pt+/14pt bold+) 명도 대비 ≥ 3:1"
        - "터치 타겟 ≥ 44×44px"
        - "키보드 탐색 가능·포커스 표시 실재"
        - "의미 있는 이미지 대체 텍스트"
  exclusionRule:
    silentOmission: "금지"  # 요소 단위 제외 = reason + confirmedBy 필수(산출물 제외와 동형)

# (사) UI 디자인 원칙 7종 (Visual Contract 트랙 Wave 2 — designElements 형제·Policy as Data)
# 디자이너 역할 브리프에 주입되고(바인딩 §7A) mock 수렴 리뷰의 리뷰 차원으로 대조된다(바인딩 §7C).
# gist 는 자체 문면(원문 전재 아님). 출처(앵커·참고): https://www.figma.com/ko-kr/resource-library/ui-design-principles/
# 값 조정 = 데이터 정정(규약 무변경). 정본 값 문면: 바인딩 §7.2 (사). 해설·예/반례: 비정본 부록 visual-contract-catalog.md(강제 근거 아님·SP-INV 5).
designPrinciples:
  - { id: hierarchy,              name: "계층 구조",   gist: "크기·두께·색·간격으로 정보 우선순위를 시각적으로 유도한다." }
  - { id: progressive-disclosure, name: "점진적 공개", gist: "단계당 적정 정보량만 노출하고 진행 상황을 명시한다(한 번에 과부하 금지)." }
  - { id: consistency,           name: "일관성",     gist: "패턴을 전체에서 동일하게 유지하고, 이탈은 근거를 요구한다." }
  - { id: contrast,              name: "대비",       gist: "중요 동작·정보에 시각적 우선순위를 부여해 눈에 띄게 한다." }
  - { id: accessibility,         name: "접근성",     gist: "모두가 지각·조작 가능하게 한다. 기계 판정 가능분은 designElements.projectScope.accessibility-floor.criteria 로 물리화(상호 참조)." }
  - { id: proximity,             name: "근접성",     gist: "관련 있는 요소를 가까이 배치해 관계를 드러낸다." }
  - { id: alignment,             name: "정렬",       gist: "그리드 기반으로 요소를 정렬해 질서와 스캔 가능성을 만든다." }
  # (신규·Wave 3 UX) Nielsen 사용성 휴리스틱 10종 append(위 7종 UI 원칙과 병렬·designPrinciples 전체가 브리프/리뷰에 주입됨).
  # gist 는 자체 문면(원문 전재 아님). 출처(앵커·참고): https://www.nngroup.com/articles/ten-usability-heuristics/
  - { id: visibility-of-system-status, name: "시스템 상태 가시성", gist: "지금 무슨 일이 일어나는지 적시 피드백으로 알린다." }
  - { id: match-real-world,            name: "실세계 일치",       gist: "사용자 언어·개념·순서로 말한다(시스템 용어 강요 금지)." }
  - { id: user-control-freedom,        name: "사용자 제어와 자유", gist: "실수 후 나갈 비상구·되돌리기/다시하기를 제공한다." }
  # consistency-standards 는 UI 원칙 consistency(일관성)와 계열이 다르다(휴리스틱 vs UI 원칙) — 판단·중복 조정은 리뷰 게이트 몫(상호 참조).
  - { id: consistency-standards,       name: "일관성과 표준",     gist: "같은 것을 같게 표현하고 플랫폼 관례를 따른다." }
  - { id: error-prevention,            name: "오류 예방",         gist: "오류 메시지보다, 오류가 나지 않도록 설계로 막는다." }
  - { id: recognition-over-recall,     name: "회상보다 인지",     gist: "필요 정보를 노출해 기억 부담을 줄인다." }
  - { id: flexibility-efficiency,      name: "유연성과 효율",     gist: "초보·숙련 모두를 위해 단축 경로를 제공한다." }
  - { id: aesthetic-minimalism,        name: "미니멀리즘",        gist: "관련 없는 정보를 덜어 신호 대 잡음을 높인다." }
  - { id: error-recognition-recovery,  name: "오류 인식·진단·복구", gist: "오류를 평이한 말로 알리고 원인·해결책을 제시한다." }
  - { id: help-documentation,          name: "도움말·문서",       gist: "필요 시 찾기 쉬운 도움말·구체 절차를 제공한다." }

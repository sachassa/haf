# Solution Design Policy — 기본 프로파일 (Policy as Data — planning/specs/04-solution-design.md §3.2)
# 정본 값 문면: uahf/framework/adapters/claude/solution-design-binding.md §7.2 (최소 실값 1세트)
# 값 조정 = 데이터 정정 — 규약 절차·정본 계약 무변경 (04 §3.2)
policyId: default-policy

# (가) 성숙/스킵 판정 기준 (04 §3.2 — 산출은 이진 분기·판정 근거 기록)
maturationSignals:
  - "architectureDirection.open 비공집합 (미결 설계 결정 존재)"      # 03 §3.2-A 그룹 6
  - "readiness.openQuestions 비공집합 (미해결 질문 존재)"            # 03 §3.2-A 그룹 8
  - "assumptionLedger 비공집합 (미해결 가정 — ReadyWithAssumptions)" # 03 §3.2-A 그룹 7
  - "다관심사 지표 (설계 관심사 2개 이상 교차)"
skipRule: "위 신호 전부 부재 ∧ 단일 관심사 → 스킵 (T2 Assessing→Validating · T9 확인→Skipped · 경량 사용자 확인 D6)"

# (나) 역할 선택 규칙 (04 §3.3 — Capability 선언·개방 네임스페이스·최소 할당·전체 커버리지 바닥)
roleSelection:
  basis: "판정 근거가 식별한 설계 관심사에서 파생"
  perConcern: 1                 # 관심사당 최소 필요 역할만
  wholeScopeCoverage: required  # 04 §3.3 커버리지 바닥·SP-INV 9 — 선언 전체 범위 관장 역할은 필수 바닥(전문 역할 상한 불산입)
  maxSpecialistRoles: 3         # SP-INV 8 — 전문/관심사 역할만 상한(커버리지 바닥 불산입). §DC-6 configurable
  fixedTeam: "금지"             # SP-INV 5 — 개방 네임스페이스·고정 역할 카탈로그 0

# (다) Projection 선택 정책 (04 §3.5 — 동적 선택=기본값 opt-out·전 유형 강제 금지·SP-INV 9 기본 필수 세트)
projectionSelection:
  # 개방 레지스트리 전체 카탈로그는 비정본 부록(projection-catalog.md) 소관 — 아래 defaultRequiredSet은
  # 그 카탈로그 중 성숙 경로 default-required 부분집합(층위: 부록=전체 레지스트리, Policy=기본 필수 세트).
  typeCatalog: open-registry
  mode: "프로젝트 유형·복잡도에 따라 동적 선택"   # 04 §3.5 — 기본값으로부터 정당화된 이탈(opt-out), 기본값 opt-in 아님
  forceAllTypes: "금지"                          # 개방 레지스트리 전체 강제 금지 — defaultRequiredSet은 성숙 경로 default-required 부분집합(무모순)
  existingCanonical: "대상 워크스페이스에 해당 유형 정본 실재 시 신규 강제 0"

  # requirement 클래스 정의 (SP-INV 9 — 요건 클래스별 default-required 조건)
  requirementClasses:
    always:     "항상 default-required — 제외는 설계단계 명시 결정 + 사유 기록 + 사용자 확인만"
    touchpoint: "접점(웹·앱·포털) 선언 시 required — 미선언 시 자동 N/A"
    interface:  "외부 연계 선언 시 required — 미연계 시 자동 N/A"

  # 기본 필수 Projection 세트 (성숙 경로 default-required 부분집합 — 정본 값 문면: 바인딩 §7.2 (다))
  defaultRequiredSet:
    - { id: project-plan,     name: "프로젝트 계획서",     requirement: always }
    - { id: requirements-def, name: "요구사항 정의서",     requirement: always }
    - { id: business-process, name: "업무 프로세스",       requirement: always }
    - { id: functional-spec,  name: "기능 명세서",         requirement: always }
    - { id: table-def,        name: "테이블 정의서",       requirement: always }
    - { id: test-plan-cases,  name: "테스트 계획·케이스",   requirement: always }
    - { id: screen-list,      name: "화면 목록",           requirement: touchpoint }
    - { id: menu-structure,   name: "메뉴 구조도",         requirement: touchpoint }
    - { id: screen-design,    name: "화면 설계서",         requirement: touchpoint }
    - { id: interface-spec,   name: "인터페이스 명세서",   requirement: interface }

  # 제외 규칙 (SP-INV 9 — 침묵 누락 금지)
  exclusionRule:
    silentOmission: "금지"   # 산출도 제외 기록도 없이 구현 경계 넘기 금지 (04 SP-INV 9)
    autoExclude:    "touchpoint/interface 미충족 시 자동 N/A"
    manualExclude:  "always 클래스 제외 시 사유 기록 + 사용자 확인 — 성숙 run 기록(events/maturation-<run-id>/)에 남김"

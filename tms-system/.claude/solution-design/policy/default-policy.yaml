# Solution Design — 기본 Policy 데이터 (Policy as Data)
# 정본 문면: planning/adapters/claude/solution-design-binding.md §7.2 (최소 실값 1세트)
# 값 조정 = 데이터 정정일 뿐 Orchestrator 규약 절차·정본 계약(04 §3.2·§3.3·§3.5)을 변경하지 않는다.
policyId: default-policy
schemaNote: 자기서술 구조. 아래 세 블록 = 04 §4.1 행4가 위임한 세 정책.

# (가) 성숙/스킵 판정 신호 — 04 §3.2 (산출은 이진 분기, 판정 기준은 정책 데이터)
maturationDecision:
  # 아래 신호 중 하나라도 참이면 성숙 필요(→ 역할 할당·Proposing).
  maturationSignals:
    - id: 1
      signal: architectureDirection.open 비공집합 (미결 설계 결정 존재)
      sourceField: 그룹6 Architecture Direction
    - id: 2
      signal: readiness.openQuestions 비공집합 (미해결 질문 존재)
      sourceField: 그룹8 Readiness
    - id: 3
      signal: assumptionLedger 비공집합 (미해결 가정 존재 — ReadyWithAssumptions)
      sourceField: 그룹7 Assumption Ledger
    - id: 4
      signal: 다관심사 지표 (설계 관심사 2개 이상 교차)
      sourceField: 판정 근거 종합
  # 전부 부재 ∧ 단일 관심사이면 스킵(→ Validating 경량 확인·T2→T9).
  skipCondition:
    when: 위 maturationSignals 1~4 전부 부재 AND 단일 관심사
    then: skip
    transition: T2 Assessing→Validating, T9 확인→Skipped
    rationale: vN이 곧 UAHF 소비 대상

# (나) 역할 선택 규칙 — 04 §3.3 (Capability 선언·개방 네임스페이스·최소 할당)
roleSelection:
  derivationBasis: 판정 근거가 식별한 설계 관심사(성숙 신호가 가리키는 미결 관심사)에서 역할 파생
  rolesPerConcern: 1        # 관심사당 최소 1 (관심사당 최소 필요 역할만)
  maxRoles: 3               # 역할 수 상한 3 — 불필요한 다중 역할 구성 강제 금지 (SP-INV 8)
  fixedTeamEnumeration: forbidden  # 고정 팀 열거 금지 — 역할명은 개방 네임스페이스, 고정 카탈로그 0 (SP-INV 5·UAF-INV ⑥)

# (다) Projection 선택 정책 — 04 §3.5 (동적 선택·전 유형 강제 금지)
projectionSelection:
  selectionMode: dynamic           # 프로젝트 유형·복잡도에 따라 동적 선택
  forceAllTypes: forbidden         # 모든 프로젝트에 모든 Projection 유형 강제 금지
  skipWhenCanonExists: true        # 대상 워크스페이스에 해당 유형 정본이 이미 실재하면 신규 강제 0
  typeCatalog: open-registry       # 유형 카탈로그는 개방 레지스트리·비정본 부록 소관 (여기서 열거하지 않음)
